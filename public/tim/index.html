<script>
function downloadVCard() {

  var blob = new Blob([vcard], { type: 'text/vcard' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'Tim-Bailey-VBO.vcf'; a.click();
  URL.revokeObjectURL(url);
}
function shareCard() {
  if (navigator.share) {
    navigator.share({ title: 'Tim Bailey | VBO Advertising', text: 'Connect with Tim Bailey, Founder of VBO Advertising', url: 'https://vboadv.com/tim' });
  } else {
    navigator.clipboard.writeText('https://vboadv.com/tim').then(function() {
      var btn = document.querySelector('.btn-secondary');
      var orig = btn.innerHTML;
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Copied!';
      setTimeout(function() { btn.innerHTML = orig; }, 2000);
    });
  }
}
